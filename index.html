<script>
    const { createApp, ref, computed, reactive, watch, onMounted } = Vue;

    // ==========================================
    // DÁN LINK GOOGLE APPS SCRIPT VÀO ĐÂY
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQAa30o7s5P3IPAxq82e45Mf3Yt4Jxk44gfpjriqLODNJltm2IPDaSUy4vW3LxNmZmPQ/exec'; 
    // ==========================================

    const rawNames = [
        "Lê Thúy An", "Nguyễn Thị Vân An", "Lê Văn Chinh", "Trương Thành Công", "Dương Viết Dũng", "Phạm Thùy Duyên", "Mai Xuân Đạt", "Lê Văn Hải", 
        "Huỳnh Trung Hiếu", "Trần Văn Huỳnh Hiếu", "Nguyễn Hữu Hòa", "Ngô Gia Khánh", "Nguyễn Xuân Bảo Khánh", "Lê Tự Quốc Kiệt", "Lương Thị Thư Kiều", "Lê Vũ Duy Lâm", 
        "Nguyễn Đặng Trà Linh", "Võ Văn Phi Long", "Lý Phạm Bảo Ngọc", "Lê Văn Nhật", "Huỳnh Thị Yến Nhi", "Võ Yến Nhi", "Phan Thị Quỳnh Như", "Nguyễn Thị Xuân Phúc", 
        "Trần Văn Tú Tài", "Lương Thị Thu Thảo", "Trần Văn Thịnh", "Lê Thị Thủy", "Võ Thị Hoài Thư", "Ngô Thị Thùy Trang", "Nguyễn Thị Thanh Trúc", "Nguyễn Lê Anh Trường", 
        "Nguyễn Lê Nhật Trường", "Nguyễn Hữu Tú", "Trần Văn Tuấn", "Nguyễn Đức Duy Tường", "Phạm Đức Vinh", "Lê Đức Quốc Vũ", "Nguyễn Thị Kiều Vy", "Trần Quang Vỹ", "Võ Minh Ý"
    ];

    createApp({
        setup() {
            const schoolMonths = ["09", "10", "11", "12", "01", "02", "03", "04", "05"];
            const appMode = ref('login'); 
            const teacherPasswordInput = ref('');
            const parentCodeInput = ref('');
            const parentPasswordInput = ref(''); 
            const loginError = ref('');
            const loggedInStudent = ref(null);
            const currentViewWeek = ref(1);
            const parentViewWeek = ref('none'); 
            
            const showChangePassword = ref(false);
            const oldPass = ref(''); const newPass = ref(''); const confirmPass = ref('');
            const passMsg = ref(''); const passMsgType = ref('');

            const showManageClassModal = ref(false);
            const newStudentListText = ref('');
            
            const isSyncing = ref(false); // Trạng thái đồng bộ dữ liệu

            const createDefaultWeeks = () => { let wp = {}; for(let w = 1; w <= 36; w++) wp[w] = 0; return wp; };

            let initialStudents = rawNames.map((name, i) => {
                const code = 'PH' + (i < 9 ? '0' + (i + 1) : (i + 1));
                return { id: i + 1, name: name, parentCode: code, parentPassword: '123456', weeklyPoints: createDefaultWeeks(), animating: false };
            });

            const students = reactive(initialStudents);
            const history = ref([]);

            // ==========================================
            // HÀM GIAO TIẾP VỚI GOOGLE SHEETS
            // ==========================================
            const loadDataFromDatabase = async () => {
                try {
                    loginError.value = "Đang tải dữ liệu lớp học...";
                    const response = await fetch(SCRIPT_URL + '?action=getData');
                    const data = await response.json();
                    
                    if (data.students && data.students.length > 0) {
                        students.splice(0, students.length, ...data.students);
                    }
                    if (data.history) {
                        history.value = data.history;
                    }
                    loginError.value = "";
                } catch (error) {
                    console.error("Lỗi tải dữ liệu:", error);
                    loginError.value = "Lỗi kết nối máy chủ. Vui lòng thử lại sau.";
                }
            };

            const saveDataToDatabase = async () => {
                isSyncing.value = true;
                try {
                    // Dùng text/plain để vượt qua lỗi CORS của Google Script
                    await fetch(SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({
                            action: 'saveData',
                            students: students,
                            history: history.value
                        })
                    });
                } catch (error) {
                    console.error("Lỗi lưu dữ liệu:", error);
                    alert("Cảnh báo: Không thể lưu dữ liệu lên hệ thống!");
                }
                isSyncing.value = false;
            };

            onMounted(() => {
                loadDataFromDatabase();
            });

            // Tự động lưu lên Google Sheets mỗi khi mảng history thay đổi (khi cộng/trừ điểm)
            watch(history, () => {
                if(appMode.value === 'teacher') saveDataToDatabase();
            }, { deep: true });

            // ==========================================
            
            const loginTeacher = () => {
                if (teacherPasswordInput.value === '123456A@') {
                    appMode.value = 'teacher';
                    loginError.value = '';
                } else loginError.value = 'Mật khẩu giáo viên không đúng!';
            };

            const loginParent = async () => {
                loginError.value = "Đang kiểm tra dữ liệu...";
                // Tải lại dữ liệu mới nhất trước khi phụ huynh đăng nhập (đề phòng GV vừa chấm)
                await loadDataFromDatabase(); 

                const code = parentCodeInput.value.toUpperCase().trim();
                const pass = parentPasswordInput.value.trim();
                const student = students.find(s => s.parentCode === code);
                
                if (student) {
                    if (student.parentPassword === pass) {
                        loggedInStudent.value = student;
                        parentViewWeek.value = 'none'; 
                        parentAIFeedback.value = '';
                        appMode.value = 'parent';
                        loginError.value = '';
                    } else {
                        loginError.value = 'Mật khẩu phụ huynh không đúng!';
                    }
                } else {
                    loginError.value = 'Mã phụ huynh không tồn tại. Vui lòng nhập từ PH01 đến PH41.';
                }
            };

            const logout = () => {
                appMode.value = 'login';
                teacherPasswordInput.value = ''; parentCodeInput.value = ''; parentPasswordInput.value = '';
                loggedInStudent.value = null; selectedStudent.value = null;
                loadDataFromDatabase(); // Cập nhật lại dữ liệu mới nhất khi ra màn hình chờ
            };

            const changePassword = async () => {
                if (oldPass.value !== loggedInStudent.value.parentPassword) {
                    passMsg.value = 'Mật khẩu hiện tại không đúng!'; passMsgType.value = 'error'; return;
                }
                if (newPass.value.length < 4) {
                    passMsg.value = 'Mật khẩu mới phải từ 4 ký tự trở lên!'; passMsgType.value = 'error'; return;
                }
                if (newPass.value !== confirmPass.value) {
                    passMsg.value = 'Xác nhận mật khẩu không khớp!'; passMsgType.value = 'error'; return;
                }

                const st = students.find(s => s.id === loggedInStudent.value.id);
                if(st) {
                    st.parentPassword = newPass.value;
                    passMsg.value = 'Đang lưu mật khẩu...'; passMsgType.value = 'success';
                    
                    await saveDataToDatabase(); // Lưu mật khẩu mới lên mây
                    
                    passMsg.value = 'Đổi mật khẩu thành công!';
                    setTimeout(() => {
                        showChangePassword.value = false;
                        oldPass.value = ''; newPass.value = ''; confirmPass.value = ''; passMsg.value = '';
                    }, 1500);
                }
            };

            const openManageClassModal = () => {
                newStudentListText.value = students.map(s => s.name).join('\n');
                showManageClassModal.value = true;
            };

            const importNewClass = async () => {
                if(confirm("CẢNH BÁO: Thao tác này sẽ XÓA TOÀN BỘ dữ liệu điểm số, lịch sử và mật khẩu Phụ huynh hiện tại trên toàn hệ thống. Bạn chắc chắn chứ?")) {
                    const names = newStudentListText.value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
                    if(names.length === 0) { alert("Danh sách học sinh không được để trống!"); return; }
                    
                    const newStudentsList = names.map((name, i) => {
                        const code = 'PH' + (i < 9 ? '0' + (i + 1) : (i + 1));
                        return { id: i + 1, name: name, parentCode: code, parentPassword: '123456', weeklyPoints: createDefaultWeeks(), animating: false };
                    });

                    students.splice(0, students.length, ...newStudentsList);
                    history.value = [];
                    selectedStudent.value = null;
                    showManageClassModal.value = false;
                    
                    // Xóa và lưu đè lên mây (Không cần gọi saveDataToDatabase() vì watch(history) sẽ tự gọi khi mảng bị reset về [])
                    alert("Đã cập nhật danh sách lớp mới thành công lên hệ thống!");
                }
            };

            const selectedStudent = ref(null);
            const activeTab = ref('positive');
            const aiFeedback = ref('');
            const isAILoading = ref(false);
            const parentAIFeedback = ref('');
            const isParentAILoading = ref(false);

            const getViewLabel = () => {
                if (currentViewWeek.value === 'total') return 'Tổng 36 Tuần';
                if (typeof currentViewWeek.value === 'string' && currentViewWeek.value.startsWith('month_')) {
                    const mIndex = parseInt(currentViewWeek.value.split('_')[1]);
                    return 'Tháng ' + schoolMonths[mIndex - 1];
                }
                return 'Tuần ' + currentViewWeek.value;
            };

            const getParentViewLabel = () => {
                if (parentViewWeek.value === 'none') return 'Chưa chọn thời gian'; 
                if (parentViewWeek.value === 'total') return 'Tổng kết 36 Tuần';
                if (typeof parentViewWeek.value === 'string' && parentViewWeek.value.startsWith('month_')) {
                    const mIndex = parseInt(parentViewWeek.value.split('_')[1]);
                    return 'Tháng ' + schoolMonths[mIndex - 1];
                }
                return 'Tuần ' + parentViewWeek.value;
            };

            const getStudentDisplayPoints = (student, weekScope) => {
                if (!student || weekScope === 'none') return 0; 
                if (weekScope === 'total') return Object.values(student.weeklyPoints).reduce((sum, val) => sum + val, 0);
                if (typeof weekScope === 'string' && weekScope.startsWith('month_')) {
                    const month = parseInt(weekScope.split('_')[1]);
                    let monthTotal = 0;
                    for (let w = (month - 1) * 4 + 1; w <= month * 4; w++) monthTotal += student.weeklyPoints[w] || 0;
                    return monthTotal;
                }
                return student.weeklyPoints[weekScope] || 0;
            };

            const displayHistory = computed(() => {
                if (currentViewWeek.value === 'total') return history.value.slice(0, 50);
                if (typeof currentViewWeek.value === 'string' && currentViewWeek.value.startsWith('month_')) {
                    const month = parseInt(currentViewWeek.value.split('_')[1]);
                    const startW = (month - 1) * 4 + 1; const endW = month * 4;
                    return history.value.filter(h => h.week >= startW && h.week <= endW).slice(0, 40);
                }
                return history.value.filter(h => h.week === currentViewWeek.value).slice(0, 30);
            });
            
            const parentViewHistory = computed(() => {
                if(!loggedInStudent.value || parentViewWeek.value === 'none') return []; 
                let filtered = history.value.filter(h => h.studentName === loggedInStudent.value.name);
                
                if (parentViewWeek.value === 'total') { /* All */ } 
                else if (typeof parentViewWeek.value === 'string' && parentViewWeek.value.startsWith('month_')) {
                    const month = parseInt(parentViewWeek.value.split('_')[1]);
                    const startW = (month - 1) * 4 + 1; const endW = month * 4;
                    filtered = filtered.filter(h => h.week >= startW && h.week <= endW);
                } else {
                    filtered = filtered.filter(h => h.week === parentViewWeek.value);
                }
                return filtered.slice(0, 20); 
            });

            // Logic AI nhận xét giữ nguyên...
            const getSimulatedAIFeedback = () => { /* Code cũ của bạn */ 
                isAILoading.value = true; aiFeedback.value = "";
                setTimeout(() => {
                    const totalPoints = getStudentDisplayPoints(selectedStudent.value, 'total');
                    const studentLogs = history.value.filter(h => h.studentName === selectedStudent.value.name).slice(0, 5);
                    let negativeCount = studentLogs.filter(l => l.points < 0).length;
                    let feedback = `Đánh giá học sinh ${selectedStudent.value.name}: `;
                    if (totalPoints > 100) feedback += "Em đang có phong độ học tập xuất sắc, thể hiện sự trưởng thành vượt bậc.";
                    else if (totalPoints > 60) feedback += "Em duy trì nề nếp tốt, tuy nhiên cần phát biểu bài nhiều hơn.";
                    else if (totalPoints > 20) feedback += "Học sinh có tiến bộ nhưng chưa ổn định, cần chú ý tác phong.";
                    else feedback += "Điểm thi đua đang ở mức báo động, cần trò chuyện riêng để tìm hiểu khó khăn.";
                    if (negativeCount >= 2) feedback += " (AI nhận thấy em có dấu hiệu vi phạm nội quy liên tục gần đây).";
                    aiFeedback.value = feedback; isAILoading.value = false;
                }, 1500); 
            };

            const getParentSimulatedAIFeedback = () => { /* Code cũ của bạn */
                 isParentAILoading.value = true; parentAIFeedback.value = "";
                 setTimeout(() => {
                    const points = getStudentDisplayPoints(loggedInStudent.value, parentViewWeek.value);
                    const logs = parentViewHistory.value; 
                    const negativeCount = logs.filter(l => l.points < 0).length;
                    let timeText = '';
                    let isMonth = typeof parentViewWeek.value === 'string' && parentViewWeek.value.startsWith('month_');
                    
                    if (parentViewWeek.value === 'total') timeText = 'Tổng quan quá trình';
                    else if (isMonth) {
                        const mIndex = parseInt(parentViewWeek.value.split('_')[1]);
                        timeText = `Tổng kết Tháng ${schoolMonths[mIndex - 1]}`;
                    }
                    else timeText = `Trong Tuần ${parentViewWeek.value}`;
                    
                    let feedback = `[${timeText}] `;
                    if (parentViewWeek.value === 'total') {
                         if(points > 100) feedback += "Chung cuộc, con đang phát triển rất tốt, cây đã bắt đầu đơm hoa kết trái. Gia đình có thể hoàn toàn yên tâm vào ý thức tự giác của con!";
                         else if (points > 40) feedback += "Nhìn chung, con đang từng bước trưởng thành và duy trì được nề nếp. Hãy tiếp tục đồng hành và động viên con phát huy!";
                         else feedback += "Tổng kết lại, con vẫn còn một số điểm cần khắc phục trong nề nếp. Phụ huynh nên trao đổi thêm với giáo viên chủ nhiệm để phối hợp hỗ trợ con.";
                    } else if (isMonth) {
                         if (points >= 50) feedback += `Con đã có một tháng học tập vô cùng xuất sắc! Đạt được ${points} điểm thi đua. Con đang thể hiện sự cố gắng vượt bậc, gia đình hãy mua cho con một món quà nhỏ để động viên nhé.`;
                         else if (points > 0) feedback += `Trong tháng này, con duy trì nề nếp khá tốt và mang về ${points} điểm. Con đang tiến bộ từng ngày, phụ huynh hãy tiếp tục sát cánh cùng con.`;
                         else if (points < 0) feedback += `Tổng kết tháng này, điểm thi đua của con đang bị âm (${points}đ). Trợ lý AI nhận thấy con đang có chiều hướng sao nhãng nội quy. Phụ huynh cần sát sao hơn và nhắc nhở con kịp thời.`;
                         else feedback += "Tháng này AI chưa ghi nhận hoạt động cộng hoặc trừ điểm nổi bật nào của con.";
                    } else {
                        if (points >= 15) feedback += `Con đã có một tuần học tập xuất sắc! Đạt được ${points} điểm thi đua. Gia đình hãy dành cho con những lời biểu dương nhé.`;
                        else if (points > 0) feedback += `Con duy trì nề nếp khá tốt trong tuần này với ${points} điểm. Tuy nhiên con có thể tích cực phát biểu hơn để đạt điểm cao hơn vào tuần tới.`;
                        else if (points < 0) feedback += `Tuần này điểm thi đua của con đang bị âm (${points}đ). Trợ lý AI nhận thấy con có mắc lỗi vi phạm nội quy. Phụ huynh nên nhắc nhở nhẹ nhàng để con chú ý hơn.`;
                        else feedback += "Tuần này chưa ghi nhận hoạt động cộng hoặc trừ điểm nổi bật nào của con.";
                    }
                    if (negativeCount > 0) feedback += ` Trợ lý AI ghi nhận chi tiết có ${negativeCount} lượt vi phạm. Phụ huynh có thể xem ở danh sách bên dưới.`;
                    parentAIFeedback.value = feedback; isParentAILoading.value = false;
                }, 1200);
            };

            const positiveActions = [{ name: "Đi học đúng giờ", points: 1 }, { name: "Chuẩn bị bài tập đầy đủ", points: 5 }, { name: "Phát biểu xây dựng bài", points: 5 }, { name: "Có tiến bộ", points: 20 }];
            const negativeActions = [{ name: "Đi trễ", points: -2 }, { name: "Nói chuyện riêng", points: -10 }, { name: "Không thuộc bài", points: -5 }, { name: "Vi phạm giao thông", points: -20 }];

            const resetData = () => {
                if(confirm("XÓA HẾT ĐIỂM: Bạn có chắc chắn muốn đặt lại điểm của CẢ 36 TUẦN về 0 không? Dữ liệu trên mây cũng sẽ bị xóa!")) {
                    students.forEach(s => { for(let w = 1; w <= 36; w++) s.weeklyPoints[w] = 0; });
                    history.value = [];
                    selectedStudent.value = null;
                }
            };

            const selectStudent = (student) => { selectedStudent.value = student; aiFeedback.value = ''; };

            const addPoints = (action) => {
                if (!selectedStudent.value || appMode.value !== 'teacher' || typeof currentViewWeek.value === 'string') return;
                const student = students.find(s => s.id === selectedStudent.value.id);
                student.weeklyPoints[currentViewWeek.value] += action.points;
                student.animating = true;
                setTimeout(() => { student.animating = false; }, 400);
                history.value.unshift({ studentName: student.name, action: action.name, points: action.points, week: currentViewWeek.value, time: new Date().toLocaleTimeString() });
                if(history.value.length > 500) history.value.pop();
            };

            const getPlantStage = (points) => {
                if (points <= 20) return "Hạt giống"; if (points <= 40) return "Nảy mầm"; if (points <= 60) return "Cây non"; 
                if (points <= 80) return "Cây phát triển"; if (points <= 100) return "Trưởng thành"; if (points <= 120) return "Ra hoa"; return "Kết trái";
            };

            const getPlantIcon = (points) => {
                if (points <= 20) return "fa-solid fa-seedling"; if (points <= 40) return "fa-solid fa-leaf"; if (points <= 60) return "fa-brands fa-envira"; return "fa-solid fa-tree"; 
            };

            const getIconColor = (points) => {
                if (points <= 20) return "text-amber-700"; if (points <= 40) return "text-lime-500"; if (points <= 60) return "text-green-500"; 
                if (points <= 80) return "text-green-700"; if (points <= 120) return "text-emerald-800 drop-shadow-[0_2px_2px_rgba(0,0,0,0.3)] text-5xl"; return "text-emerald-900 drop-shadow-[0_4px_4px_rgba(0,0,0,0.4)] text-6xl"; 
            };

            const getPointsColor = (points) => {
                if (points < 0) return 'text-red-500'; if (points <= 20) return 'text-orange-700'; if (points <= 80) return 'text-green-600'; 
                if (points <= 100) return 'text-emerald-700'; if (points <= 120) return 'text-pink-600'; return 'text-red-700 font-black';
            };

            return {
                schoolMonths,
                appMode, teacherPasswordInput, parentCodeInput, parentPasswordInput, loginError, loggedInStudent, loginTeacher, loginParent, logout,
                showChangePassword, oldPass, newPass, confirmPass, passMsg, passMsgType, changePassword,
                showManageClassModal, newStudentListText, openManageClassModal, importNewClass, 
                students, selectedStudent, activeTab, positiveActions, negativeActions, history, displayHistory, parentViewHistory, currentViewWeek,
                parentViewWeek, getParentViewLabel, parentAIFeedback, isParentAILoading, getParentSimulatedAIFeedback,
                aiFeedback, isAILoading, getSimulatedAIFeedback, resetData, selectStudent, addPoints, getStudentDisplayPoints, getPlantStage, getPlantIcon, getIconColor, getPointsColor, getViewLabel,
                isSyncing
            }
        }
    }).mount('#app')
</script>
